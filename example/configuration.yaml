# Loads default set of integrations. Do not remove.
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

template:
  - triggers:
      - trigger: event
        event_type: external_sensor_update

    sensor:
      - name: Temperature
        unique_id: external_temperature
        unit_of_measurement: "K"
        state: "{{ trigger.event.data.temperature }}"

      - name: Pressure
        unique_id: external_pressure
        unit_of_measurement: "kPa"
        state: "{{ trigger.event.data.pressure }}"

      - name: Solar Vertical
        unique_id: solar_vertical
        unit_of_measurement: "°"
        state: "{{ trigger.event.data.solar_vertical }}"

      - name: Solar Horizontal
        unique_id: solar_horizontal
        unit_of_measurement: "°"
        state: "{{ trigger.event.data.solar_horizontal }}"

      - name: AC Target Temperature
        unique_id: stationeers_target_temperature
        unit_of_measurement: "K"
        state: "{{ trigger.event.data.ac_temperature }}"

    binary_sensor:
      - name: Stationeers Light
        unique_id: stationeers_light_state
        state: "{{ trigger.event.data.light | int(0) == 1 }}"

  # Controls derive their state from the stored entities above
  - number:
      - name: Stationeers Target Temperature
        unique_id: stationeers_temperature
        unit_of_measurement: "K"
        state: "{{ states('sensor.ac_target_temperature') }}"
        min: 250
        max: 350
        step: 0.1

        set_value:
          action: rest_command.stationeers_set_temperature
          data:
            temperature: "{{ value }}"

    switch:
      - name: Stationeers Light
        unique_id: stationeers_light
        state: "{{ is_state('binary_sensor.stationeers_light', 'on') }}"

        turn_on:
          action: rest_command.stationeers_light_on

        turn_off:
          action: rest_command.stationeers_light_off

rest_command:
  stationeers_light_on:
    url: "http://host.docker.internal:8081/light"
    method: POST
    content_type: "application/json"
    payload: '{"state": 1}'

  stationeers_light_off:
    url: "http://host.docker.internal:8081/light"
    method: POST
    content_type: "application/json"
    payload: '{"state": 0}'

  stationeers_set_temperature:
    url: "http://host.docker.internal:8081/temperature"
    method: POST
    content_type: "application/json"
    payload: '{"temperature": {{ temperature | float }}}'     